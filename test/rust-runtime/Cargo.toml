[package]
name = "an5-client-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
an5-client = { path = "../../rust" }
an5-adapters = { path = "../../../an5Adapters/rust" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["any", "sqlite", "runtime-tokio"] }

[patch.crates-io]
an5-adapters = { path = "../../../an5Adapters/rust" }
